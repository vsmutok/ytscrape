name: Bug report
description: Report unexpected behaviour or a regression
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. A minimal reproducible example helps a lot.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal code or CLI commands.
      render: python
      placeholder: |
        from ytscrape import YouTube

        with YouTube() as yt:
            ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include full traceback if applicable.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ytscrape version
      placeholder: "0.1.4"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15 / Ubuntu 24.04 / Windows 11"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Locale (`hl`/`gl`), proxies, region, recent YouTube UI changes, etc.
    validations:
      required: false
