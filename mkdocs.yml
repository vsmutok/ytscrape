site_name: ytscrape
site_description: ytscrape is a free open-source YouTube scraper for Python — search, video and channel metadata, scrape YouTube comments, YouTube transcripts and channel uploads via InnerTube, no API key required.
repo_url: https://github.com/vsmutok/ytscrape
repo_name: vsmutok/ytscrape
site_url: https://vsmutok.github.io/ytscrape/
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/logo_dark.png
  favicon: assets/logo_dark.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.annotate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vsmutok/ytscrape
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/ytscrape/

extra_css:
  - assets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Examples: examples.md
  - Migrating to 2.0: migration-2.0.md
  - Guides:
      - Searching: guides/searching.md
      - Video details: guides/video-details.md
      - Channel details: guides/channel-details.md
      - Channel videos: guides/channel-videos.md
      - Models & navigation: guides/models.md
      - Comments: guides/comments.md
      - Transcripts: guides/transcripts.md
      - Language & region: guides/language-region.md
      - Pagination: guides/pagination.md
      - Async API: guides/async.md
      - MCP server: guides/mcp.md
      - Export JSON / CSV: guides/export.md
      - Error handling: guides/error-handling.md
      - Reliability: guides/reliability.md
      - Advanced: guides/advanced.md
  - API reference:
      - YouTube: api/youtube.md
      - Locale: api/locale.md
      - Filters: api/filters.md
      - Models — search: api/models-search.md
      - Models — details: api/models-details.md
      - Models — comments: api/models-comments.md
      - Models — transcripts: api/models-transcripts.md
      - InnerTube client: api/innertube-client.md
      - Reliability: api/reliability.md
      - Exceptions: api/exceptions.md
  - Recipes:
      - Comments → pandas sentiment: recipes/comments-sentiment.md
      - Transcripts → LLM / RAG: recipes/transcripts-rag.md
      - Channel monitoring: recipes/channel-monitoring.md
  - CLI:
      - Overview: cli/overview.md
  - FAQ: faq.md
  - Changelog: changelog.md
