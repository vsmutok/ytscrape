[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytscrape"
version = "0.1.4"
description = "YouTube scraper for Python — search videos, channels and playlists and fetch video metadata via the InnerTube API, no API key required."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

authors = [
    { name = "Vasyl Smutok" },
    { email = "vasyl.smutok@gmail.com" },
]

keywords = [
    "youtube",
    "youtube-api",
    "youtube-data",
    "youtube-scraper",
    "innertube",
    "scraper",
    "crawler",
    "scraping",
    "video",
    "search",
    "free",
    "no-api-key",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",

    "Typing :: Typed",
]

dependencies = [
    "defusedxml>=0.7.1",
    "pycountry>=22.3.5",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/vsmutok/ytscrape"
Repository = "https://github.com/vsmutok/ytscrape"
Documentation = "https://vsmutok.github.io/ytscrape/"
Issues = "https://github.com/vsmutok/ytscrape/issues"

[project.scripts]
ytscrape = "ytscrape.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ytscrape"]

include = [
    "src/ytscrape/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/ytscrape",
    "README.md",
    "LICENSE",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.bandit]
exclude_dirs = [
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "mkdocs-material>=9.7.7",
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "ruff>=0.14.5",
    "twine>=6.2.0",
]
